{% extends "base.html" %}
{% from "articles.html" import article_list %}
{% block content %}
<h1>HOTDOG FIGHTING</h1>
<fieldset class="topic-selector">
    <legend>Choose your topic</legend>
    <label><input type="radio" name="topic" id="topic-mma" value="mma" aria-controls="mma-news" checked><span>MMA</span></label>
    <label><input type="radio" name="topic" id="topic-boxing" value="boxing" aria-controls="boxing-news"><span>Boxing</span></label>
</fieldset>
<div class="news-container">
    <section class="news-section" id="mma-news" aria-labelledby="mma-heading">
        <h2 id="mma-heading">MMA News</h2>
        {{ article_list(mma_articles, 'MMA') }}
    </section>
    <section class="news-section" id="boxing-news" aria-labelledby="boxing-heading">
        <h2 id="boxing-heading">Boxing News</h2>
        {{ article_list(boxing_articles, 'Boxing') }}
    </section>
</div>
{% endblock %}
